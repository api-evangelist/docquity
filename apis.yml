  detail: >-
    Docquity ships only end-user products — the Dx mobile/web app for
    credential-verified doctors and a sales-led life-sciences suite — and runs
    api.docquity.com purely as its own app backend: it answers every probed path
    with a proprietary JSON error envelope and no spec, while id.docquity.com
    returns 401 even for /.well-known/openid-configuration, and no developer
    portal, reference, SDK, package or webhook surface exists on any host.
