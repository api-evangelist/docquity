aid: docquity
name: Docquity
description: >-
  Docquity is a Singapore-headquartered digital health company operating Asia's
  largest verified professional network for licensed healthcare practitioners,
  with more than 500,000 verified doctors across nine markets including
  Indonesia, Malaysia, the Philippines, Thailand, Vietnam, Singapore and Taiwan.
  Its flagship product, Dx, is an AI clinical thinking partner that bundles
  clinical search and decision support, accredited continuing medical education,
  peer community and case discussion, and patient-ready summary notes into an
  invite-only mobile and web platform gated behind medical-credential
  verification. For life-sciences and enterprise partners Docquity sells an
  Intelligence Suite comprising Pulse, which measures healthcare-professional
  conviction and engagement, and Dialog, which runs field engagement and
  activation programs against that audience. Docquity also operates Docquity
  Jobs, a medical recruitment board. The company publishes no public API,
  developer portal or machine-readable specification; its api.docquity.com
  backend and id.docquity.com identity service exist to serve its own first-party
  applications and are not offered to third-party developers.
